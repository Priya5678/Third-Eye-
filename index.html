<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer SNR | Service Portal</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b0712;
            --card-bg: rgba(22, 12, 33, 0.92);
            --border-color: #3d1b46;
            --grad-primary: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --grad-btn: linear-gradient(135deg, #ff4b4b 0%, #ff8533 50%, #d81b60 100%);
            --accent-pink: #ec4899;
            --accent-orange: #f97316;
            --accent-green: #10b981;
            --text-main: #ffffff;
            --text-sub: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(220, 39, 67, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(240, 148, 51, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 25px rgba(236, 72, 153, 0.15);
            backdrop-filter: blur(14px);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--grad-primary);
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .edu-note {
            font-size: 11px;
            color: #a855f7;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #e9d5ff;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            color: #f43f5e;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: #140920;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #ec4899;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--grad-btn);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 6px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(220, 39, 67, 0.4);
        }

        /* Step Card Section */
        .step-card {
            display: none;
            margin-top: 20px;
            background: #140920;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .step-title {
            font-size: 14px;
            font-weight: 600;
            color: #fb923c;
            margin-bottom: 6px;
        }

        .step-desc {
            font-size: 12px;
            color: #d8b4fe;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .btn-task {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 11px;
            background: var(--grad-primary);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-task:hover {
            opacity: 0.9;
        }

        /* Searching Animation Section */
        .scan-wrapper {
            display: none;
            margin-top: 20px;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background: #140920;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .radar-box {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid #581c87;
            position: relative;
            margin-bottom: 15px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .radar-ring {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .radar-sweep {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, transparent 270deg, rgba(236, 72, 153, 0.6) 360deg);
            animation: rotateRadar 1.8s linear infinite;
        }

        @keyframes rotateRadar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .scan-dot {
            width: 8px;
            height: 8px;
            background: #f97316;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 80px;
            box-shadow: 0 0 8px #f97316;
            animation: pulseDot 1.2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        .scan-log {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #f43f5e;
            height: 18px;
            text-align: center;
            margin-bottom: 10px;
        }

        .scan-bar-bg {
            width: 100%;
            height: 5px;
            background: #2e1065;
            border-radius: 4px;
            overflow: hidden;
        }

        .scan-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--grad-primary);
            transition: width 0.4s ease;
        }

        /* Result Display Box */
        .result-box {
            display: none;
            margin-top: 20px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--accent-green);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-title {
            font-size: 13px;
            color: var(--accent-green);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .result-data {
            font-family: 'JetBrains Mono', monospace;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Developer SNR</h1>
            <p class="edu-note">For Educational Purpose Only</p>
        </div>

        <!-- Initial Submission Form -->
        <form id="initForm" onsubmit="startProcess(event)">
            <div class="form-group">
                <label>Your Username / ID</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="myId" placeholder="Enter your ID" required>
                </div>
            </div>

            <div class="form-group">
                <label>Target Identifier</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-crosshairs"></i>
                    <input type="text" id="targetId" placeholder="Enter target ID" required>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <i class="fa-solid fa-bolt"></i> Start Service Request
            </button>
        </form>

        <!-- Dynamic Step-by-Step Task Card (One by One) -->
        <div id="stepCard" class="step-card">
            <div id="stepTitle" class="step-title">Step 1: Verification Required</div>
            <p id="stepDesc" class="step-desc">Agar service chahiye toh pehle verify hona padega. Kripya niche diye gaye step ko complete karein.</p>
            <a id="stepBtn" href="#" target="_blank" class="btn-task" onclick="handleTaskAction()">
                <i id="stepIcon" class="fa-brands fa-instagram"></i> <span id="stepBtnText">Follow Karein</span>
            </a>
        </div>

        <!-- Searching Animation Component -->
        <div id="scanBox" class="scan-wrapper">
            <div class="radar-box">
                <div class="radar-sweep"></div>
                <div class="radar-ring"></div>
                <div class="scan-dot"></div>
            </div>
            <div id="scanLogText" class="scan-log">Searching & processing parameters...</div>
            <div class="scan-bar-bg">
                <div id="scanProgress" class="scan-bar-fill"></div>
            </div>
        </div>

        <!-- Final Result Card -->
        <div id="resultBox" class="result-box">
            <div class="result-title"><i class="fa-solid fa-circle-check"></i> Verification Successful</div>
            <div id="resDataValue" class="result-data">+91 XXXXX-XXXXX</div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCPB-LDFMyxafa-a8aQwqybjlXkNtb9PYc",
            authDomain: "mega-admin-panel.firebaseapp.com",
            databaseURL: "https://mega-admin-panel-default-rtdb.firebaseio.com",
            projectId: "mega-admin-panel",
            storageBucket: "mega-admin-panel.firebasestorage.app",
            messagingSenderId: "266969630418",
            appId: "1:266969630418:web:7364505212a74b8cd0cf0b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentReqId = null;
        let globalLinks = {};
        let activeTask = 'follow'; // Flow sequence: follow -> like -> comment -> subscribe

        // Fetch task links from Firebase in real-time
        db.ref('settings/links').on('value', (snapshot) => {
            globalLinks = snapshot.val() || {};
            updateCurrentStepLink();
        });

        function updateCurrentStepLink() {
            const stepBtn = document.getElementById('stepBtn');
            if (activeTask === 'follow') stepBtn.href = globalLinks.follow || '#';
            else if (activeTask === 'like') stepBtn.href = globalLinks.like || '#';
            else if (activeTask === 'comment') stepBtn.href = globalLinks.comment || '#';
            else if (activeTask === 'subscribe') stepBtn.href = globalLinks.subscribe || '#';
        }

        // Handle initial submit
        function startProcess(e) {
            e.preventDefault();

            const myId = document.getElementById('myId').value.trim();
            const targetId = document.getElementById('targetId').value.trim();

            const newReq = db.ref('requests').push();
            currentReqId = newReq.key;

            newReq.set({
                user: myId,
                target: targetId,
                verified: false,
                assignedNumber: "",
                tasks: {
                    follow: false,
                    like: false,
                    comment: false,
                    subscribe: false
                },
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            document.getElementById('initForm').style.display = 'none';
            showStep('follow');
            listenToVerification(currentReqId);
        }

        // Show single step one by one
        function showStep(taskType) {
            activeTask = taskType;
            const stepCard = document.getElementById('stepCard');
            const stepTitle = document.getElementById('stepTitle');
            const stepBtnText = document.getElementById('stepBtnText');
            const stepIcon = document.getElementById('stepIcon');

            if (taskType === 'follow') {
                stepTitle.innerText = "Step 1: Follow Required";
                stepBtnText.innerText = "Follow Now";
                stepIcon.className = "fa-brands fa-instagram";
            } else if (taskType === 'like') {
                stepTitle.innerText = "Step 2: Like Required";
                stepBtnText.innerText = "Like Post";
                stepIcon.className = "fa-solid fa-heart";
            } else if (taskType === 'comment') {
                stepTitle.innerText = "Step 3: Comment Required";
                stepBtnText.innerText = "Comment on Post";
                stepIcon.className = "fa-solid fa-comment";
            } else if (taskType === 'subscribe') {
                stepTitle.innerText = "Step 4: Subscribe Required";
                stepBtnText.innerText = "Subscribe Channel";
                stepIcon.className = "fa-brands fa-youtube";
            }

            updateCurrentStepLink();
            stepCard.style.display = 'block';
        }

        // When task link is clicked
        function handleTaskAction() {
            if (!currentReqId) return;

            // Mark task in Firebase
            db.ref(`requests/${currentReqId}/tasks/${activeTask}`).set(true);

            // Hide step card and show searching radar animation
            document.getElementById('stepCard').style.display = 'none';
            const scanBox = document.getElementById('scanBox');
            scanBox.style.display = 'flex';

            runSearchingAnimation();
        }

        // Radar Scanning Animation sequence
        function runSearchingAnimation() {
            const logs = [
                "Scanning target query parameters...",
                "Querying network server nodes...",
                "Matching record indices...",
                "Awaiting verification confirmation..."
            ];

            let step = 0;
            const progressBar = document.getElementById('scanProgress');
            const logText = document.getElementById('scanLogText');

            progressBar.style.width = '0%';

            const interval = setInterval(() => {
                step++;
                progressBar.style.width = (step * 25) + '%';
                logText.innerText = logs[step - 1] || "Verifying...";

                if (step >= logs.length) {
                    clearInterval(interval);
                }
            }, 1000);
        }

        // Realtime Listener for Admin Verification
        function listenToVerification(reqId) {
            db.ref(`requests/${reqId}`).on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // When admin verifies and sets the number/data
                if (data.verified === true && data.assignedNumber) {
                    document.getElementById('scanBox').style.display = 'none';
                    document.getElementById('stepCard').style.display = 'none';
                    
                    document.getElementById('resDataValue').innerText = data.assignedNumber;
                    document.getElementById('resultBox').style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
